# M8 §9 — Configuration externe MicroProfile Fault Tolerance 4.1
# Test d'intégration : surcharge via microprofile-config.properties chargée
# automatiquement par Ravel (ConfigProvider.getConfig()).
#
# IMPORTANT : ce fichier est chargé pour TOUS les tests du module heisenberg-core.
# Pour éviter de polluer les autres tests, seules des cles ciblées (FQCN + methode)
# spécifiques au service de test ConfigResolverIntegrationTest.DemoService sont
# définies ici. Les cles globales (Retry/maxRetries, Fallback/enabled, etc.) sont
# couvertes par ConfigResolverOverrideTest via un TestConfig mock isolé.

# --- Class-level override (Timeout pour DemoService) ---
io.vidocq.heisenberg.internal.ConfigResolverIntegrationTest$DemoService/Timeout/value=3000
io.vidocq.heisenberg.internal.ConfigResolverIntegrationTest$DemoService/Timeout/unit=MILLIS

# --- Method-level override (CircuitBreaker pour DemoService#criticalCall) ---
io.vidocq.heisenberg.internal.ConfigResolverIntegrationTest$DemoService/criticalCall/CircuitBreaker/requestVolumeThreshold=42
io.vidocq.heisenberg.internal.ConfigResolverIntegrationTest$DemoService/criticalCall/CircuitBreaker/failureRatio=0.9

# --- Method-level override Retry ---
io.vidocq.heisenberg.internal.ConfigResolverIntegrationTest$DemoService/retryCall/Retry/maxRetries=5

# --- Method-level override Bulkhead ---
io.vidocq.heisenberg.internal.ConfigResolverIntegrationTest$DemoService/bulkheadCall/Bulkhead/value=15

# --- Method-level override Fallback applyOn (spec §9.1) ---
io.vidocq.heisenberg.internal.ConfigResolverIntegrationTest$DemoService/fallbackCall/Fallback/applyOn=java.io.IOException

# --- Method-level override Fallback enabled=false (cible uniquement fallbackCall) ---
io.vidocq.heisenberg.internal.ConfigResolverIntegrationTest$DemoService/fallbackCall/Fallback/enabled=false

# --- Proprietes globales sans impact direct sur les autres tests ---
mp.fault.tolerance.metrics.enabled=false
mp.fault.tolerance.interceptor.priority=4500

